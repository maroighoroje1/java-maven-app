name: LMS Frontend DEV CI/CD

on:
  push:
    branches:
      - main

env:
  # --- ECR/AWS Environment Variables ---
  AWS_DEFAULT_REGION: eu-west-3
  ECR_REPOSITORY: java-maven
  AWS_ACCOUNT_ID: 766363046258
  
  # --- Terraform variables ---
  TF_VAR_region: eu-west-3
  TF_VAR_avail_zone: eu-west-3a
  
jobs:
# ----------------------------------------------------------------------
# 1. INFRASTRUCTURE PROVISIONING JOB (Terraform)
# ----------------------------------------------------------------------
  terraform-provision:
    name: Provision Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.0.0
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="bucket=myapp-bucket-0193" \
            -backend-config="key=myapp/state.tfstate" \
            -backend-config="region=${{ env.TF_VAR_region }}"
          
      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan
        
      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve tfplan
        
      - name: Get EC2 Public IP Output
        id: output
        run: |
          EC2_PUBLIC_IP=$(terraform output -raw ec2_public_ip)
          echo "EC2_PUBLIC_IP=$EC2_PUBLIC_IP" >> $GITHUB_OUTPUT

    outputs:
      ec2_host: ${{ steps.output.outputs.EC2_PUBLIC_IP }}

# ----------------------------------------------------------------------
# 2. BUILD, PUSH, AND DEPLOYMENT JOB
# ----------------------------------------------------------------------
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: terraform-provision
    
    env:
      DEPLOY_HOST: ${{ needs.terraform-provision.outputs.ec2_host }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      # --- Build Steps ---
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # --- AWS/ECR Steps ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR and Build/Push Docker Image
        run: |
          ECR_REGION="us-east-1"
          ECR_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${ECR_REGION}.amazonaws.com"
          IMAGE_TAG="$ECR_URI/${{ env.ECR_REPOSITORY }}:latest"
          
          # Login to ECR in us-east-1
          aws ecr get-login-password --region $ECR_REGION | docker login --username AWS --password-stdin $ECR_URI

          # Build Docker Image
          docker build -t $IMAGE_TAG .

          # Push Docker Image
          docker push $IMAGE_TAG

      # --- EC2 Initialization Delay ---
      - name: ⏳ Wait for EC2 Initialization (90 seconds)
        run: sleep 90s
        shell: bash

      # --- Deployment Steps ---
      - name: Deploy to Server (SSH and Docker Compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ECR_REGION="us-east-1"
            ECR_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${ECR_REGION}.amazonaws.com"
            IMAGE_TAG="$ECR_URI/${{ env.ECR_REPOSITORY }}:latest"
            
            # Re-login to ECR on the remote server
            aws ecr get-login-password --region $ECR_REGION \
              | docker login --username AWS --password-stdin $ECR_URI

            # Pull the new image, stop/start containers
            cd /home/ubuntu/lms_frontend 
            
            docker pull $IMAGE_TAG
            
            docker compose down || true
            docker compose up -d

            echo "✅ LMS frontend deployed successfully to EC2 instance at ${{ env.DEPLOY_HOST }}"